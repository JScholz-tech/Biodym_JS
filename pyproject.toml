[project]
name = "biodym-js"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9.18",
    "graphviz>=0.21",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "kaleido>=1.0.0",
    "matplotlib>=3.10.6",
    "notebook>=7.4.5",
    "numpy>=2.3.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.0",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "xlrd>=2.0.2",
    "xlsxwriter>=3.2.5",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
norecursedirs = ["Archive", ".*", "*/Archive"]

 
