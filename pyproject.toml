[project]
name = "biodym-js"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.18",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.27.0",
    "graphviz>=0.21",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "kaleido>=1.0.0",
    "marimo>=0.23.3",
    "matplotlib>=3.10.6",
    "notebook>=7.4.5",
    "numpy>=2.3.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.0",
    "pyyaml>=6.0.2",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "voila>=0.5.11",
    "xlrd>=2.0.2",
    "xlsxwriter>=3.2.5",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
norecursedirs = ["Archive", ".*", "*/Archive", "03_studies"]
testpaths = ["04_tests"]

 
