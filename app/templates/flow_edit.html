{% extends "base.html" %}
{% block title %}Edit {{ flow.id }} — {{ cfg.name }}{% endblock %}
{% block breadcrumb %}
  <a href="/">Case Studies</a> <span>/</span>
  <a href="/{{ cfg.name }}">{{ cfg.name }}</a> <span>/</span>
  <a href="/{{ cfg.name }}/flows">Flows</a> <span>/</span>
  <strong>Edit {{ flow.id }}</strong>
{% endblock %}

{% block content %}
<h1>Edit Flow — {{ flow.id }}</h1>

<div class="card">
  <form method="post" action="/{{ cfg.name }}/flows/{{ flow.id }}/edit">
    <div class="form-grid">
      <div class="field">
        <label>Name</label>
        <input type="text" name="name" value="{{ flow.name }}" required>
      </div>
      <div class="field">
        <label>Flow ID</label>
        <input type="text" value="{{ flow.id }}" disabled class="muted">
        <div class="muted" style="margin-top:0.3rem">ID cannot be changed after creation.</div>
      </div>
      <div class="field">
        <label>From Process</label>
        <select name="from_process" required>
          {% for p in cfg.processes %}
          <option value="{{ p.id }}" {% if p.id == flow.from_process %}selected{% endif %}>
            P{{ p.id }} — {{ p.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>To Process</label>
        <select name="to_process" required>
          {% for p in cfg.processes %}
          <option value="{{ p.id }}" {% if p.id == flow.to_process %}selected{% endif %}>
            P{{ p.id }} — {{ p.name }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="btn-row" style="margin-top:1rem">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/{{ cfg.name }}/flows" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
