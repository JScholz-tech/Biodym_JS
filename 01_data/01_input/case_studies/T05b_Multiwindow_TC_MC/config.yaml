schema_version: '1.0'
name: T05b_Multiwindow_TC_MC
description: "\U0001F4D8 Tutorial T05b — Multi-window Monte Carlo on a dynamic TC\r\
  \n\r\nBuilds on T05 (Dynamic transfer coefficients): here the same dynamic transfer\
  \ coefficient is given Monte Carlo uncertainty over several distinct year windows,\
  \ so a time-varying split can carry different uncertainty in different periods.\r\
  \n\r\nWhat it shows\r\n• The same TC id (e.g. the DM split at the incineration process)\
  \ appears in more than one Monte Carlo row, each pinned to its own start/end year\
  \ window.\r\n• Within each window the sampled values are re-normalised so the outgoing\
  \ split still sums to 1.0; windows are sampled independently of one another.\r\n\
  • Outside the windows the dynamic TC keeps its defined trajectory untouched.\r\n\
  \r\nTry it\r\n• Open the MC Parameters page: note two windows (2030–2050 and 2070–2090)\
  \ for each of the two DM transfer coefficients of Process 3.\r\n• Keep operation\
  \ = set (TC uncertainty is always absolute) and each window's two means summing\
  \ to ~1.0.\r\n\r\nLook for\r\n• MC spread on the downstream flows appears only inside\
  \ the two windows.\r\n• The setup report lists the windowed TCs separately (no silent\
  \ overwrite)."
