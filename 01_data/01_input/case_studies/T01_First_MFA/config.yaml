schema_version: '1.0'
name: T01_First_MFA
description: "\U0001F4D8 Tutorial T01 — Hello MFA\r\n\r\nThe simplest possible model:\
  \ one material flow from the system boundary to a sink.\r\n\r\nWhat it shows\r\n\
  • P0 is the system boundary (the environment) — every model starts here.\r\n• A\
  \ single flow carries 100 Mg/yr from the boundary (Input) to a sink (Output).\r\n\
  • \"Flow data\" sets the amount per year; the engine interpolates between the years\
  \ you enter.\r\n\r\nTry it\r\n• Run the analysis (no transfer coefficients are needed\
  \ for a single flow).\r\n\r\nLook for\r\n• Sankey: one arrow, 100 Mg/yr.\r\n• Validation:\
  \ mass-balance error = 0 (inflow equals outflow)."
