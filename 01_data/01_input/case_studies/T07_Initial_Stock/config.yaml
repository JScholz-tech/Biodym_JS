schema_version: '1.0'
name: T07_Initial_Stock
description: '📘 Tutorial T07 — Initial stock


  Some processes start with material already in place at t = 0 — a legacy stock that
  then feeds into the system over time. This model shows the two ways an initial stock
  is released, side by side.


  What it shows

  • An initial stock only depletes through a DSM process: the stock is placed at t
  = 0 and the DSM module releases it over time.

  • P1 "Legacy stock — cohort" uses the age-cohort method — the stock retires on a
  lifetime distribution (Normal, mean 20 yr, std 5).

  • P3 "Legacy stock — decay" uses simple exponential decay (characteristic time ~20
  yr).

  • Neither process has an inflow, so the curves are pure legacy-stock drawdown.


  Try it

  • Open each DSM process''s Initial Stock editor to see the quantity, composition
  and cohort/decay settings.

  • Compare the P1 and P3 stock curves: the cohort retires as a delayed, bell-shaped
  wave; decay falls fastest at the start.


  Look for

  • Stock plot: both stocks start at 1000 Mg and drain toward 0; the released material
  accumulates in the two sinks (P2, P4).'
