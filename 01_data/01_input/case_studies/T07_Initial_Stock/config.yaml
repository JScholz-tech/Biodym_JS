schema_version: '1.0'
name: T07_Initial_Stock
description: '📘 Tutorial T07 — Initial stock


  Shows how to seed a process with material that already exists at the start of the
  model (t = 0), instead of building it up from inflows.


  What it shows

  • A process configured with an initial stock: a starting quantity and its element
  composition.

  • The pre-existing stock is present from year one and behaves like any other stock
  thereafter.

  • Useful for legacy stocks — landfills, soils or buildings already in place when
  the study begins.


  Try it

  • Open the process''s Initial Stock editor to see the starting quantity, composition
  and cohort/decay settings.

  • Change the initial quantity and re-run.


  Look for

  • Stock plot: a non-zero stock in the very first year.

  • The initial stock draws down or persists according to the process''s stock configuration.'
