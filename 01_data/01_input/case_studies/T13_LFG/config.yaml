schema_version: '1.0'
name: T13_LFG
description: '📘 Tutorial T13 — Landfill gas (LFG)


  Models first-order decay of organic waste in a landfill, generating methane and
  CO2 over decades (UNFCCC AM-Tool-04 / IPCC first-order-decay).


  What it shows

  • A waste deposit decays via several organic fractions, each with its own decay
  rate k.

  • Degradable organic carbon (DOC) converts to landfill gas; methane is set by F_CH4,
  with oxidation (OX), a site correction (φ) and an optional capture fraction.

  • Water leaves as leachate; ash / inert material stays behind.


  Try it

  • Open the LFG process to see the site parameters (MCF, DOCf, F_CH4, OX, φ, capture)
  and the waste fractions (k, DOC, input share, ash).

  • Change a fraction''s decay rate k and re-run.


  Look for

  • Gas outflows (CH4, CO2) peak soon after the deposit, then decline as the fast
  fractions are exhausted.'
