schema_version: '1.0'
name: T02_Splitting_a_flow
description: "\U0001F4D8 Tutorial T02 — Splitting a flow\r\nIntroduces the Splitter:\
  \ one inflow divided into several outflows by transfer coefficients (TCs).\r\nWhat\
  \ it shows\r\n• A Splitter process receives 100 Mg/yr and sends it to two sinks.\r\
  \n• Static TCs set the split — here 70% to Sink A, 30% to Sink B.\r\n• For a Splitter,\
  \ the \"material\" column must sum to 100% across all outgoing flows.\r\n• TC IDs\
  \ follow the BioDYM convention TC_E{n}_{from}_{to}, with E1 = material (e.g. TC_E1_01_02).\r\
  \n\r\nTry it\r\n• Open the Transfer Coefficients page for the Splitter and check\
  \ the 70/30 split.\r\n• Change the fractions (keeping the sum at 100%) and re-run.\r\
  \n\r\nLook for\r\n• Sankey: the inflow divides 70/30 into the two sinks"
