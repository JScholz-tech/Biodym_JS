schema_version: '1.0'
name: T08_Scenarios
description: '📘 Tutorial T08 — Scenario analysis


  Define named scenarios that change a parameter, then compare them against the baseline
  without editing the base model.


  What it shows

  • A Splitter sends its inflow to a recycling sink and a landfill sink via transfer
  coefficients.

  • Baseline: 30% recycled, 70% landfilled.

  • A scenario "High recycling" replaces the split with 70% recycled / 30% landfilled.

  • Scenarios modify parameters at run time; the base model is untouched.


  Try it

  • Open the Scenario editor to see the "High recycling" modifications.

  • Switch the selected scenario and re-run to compare against baseline.


  Look for

  • The recycling sink stock is much larger under "High recycling" than baseline;
  landfill is smaller.'
