schema_version: '1.0'
name: T16_Complex_Flow_Composition
description: "\U0001F4BB Tutorial T16 — Complex Flow Composition (6-level hierarchy)\n\
  \nA demo case study that exercises the extensible composition hierarchy\n(six levels:\
  \ Device → Module → Component → Material → Substance → Element)\nand the sunburst\
  \ composition view.\n\nWhat it shows\n• Two input flows from the system boundary\
  \ — end-of-life Laptops and\n  Smartphones entering an e-waste collection process.\n\
  • Each device is broken down 6 levels deep, e.g.\n  Laptop → Mainboard → Electronics\
  \ → Metals → Precious_Metals → Gold,\n  and Laptop → Battery → Cells → Active_Material\
  \ → Lithium_Compound → Lithium.\n• The two flows share the same tree but differ\
  \ in their top-level module\n  split (a smartphone is more display + battery, a\
  \ laptop more enclosure).\n\nTry it\n• Open \"Elements & Hierarchy\" to see / extend\
  \ the 6 named levels.\n• Open \"Flow Compositions\" to edit the parent-relative\
  \ fractions.\n• Run the analysis, then use the Composition tab's sunburst: switch\
  \ the\n  Flow dropdown between Laptop and Smartphone and watch the rings change."
