schema_version: '1.0'
name: T16_Complex_Flow_Composition
description: |-
  💻 Tutorial T16 — Complex Flow Composition (6-level hierarchy)

  A demo case study that exercises the extensible composition hierarchy
  (six levels: Device → Module → Component → Material → Substance → Element)
  and the sunburst composition view.

  What it shows
  • Two input flows from the system boundary — end-of-life Laptops and
    Smartphones entering an e-waste collection process.
  • Each device is broken down 6 levels deep, e.g.
    Laptop → Mainboard → Electronics → Metals → Precious_Metals → Gold,
    and Laptop → Battery → Cells → Active_Material → Lithium_Compound → Lithium.
  • The two flows share the same tree but differ in their top-level module
    split (a smartphone is more display + battery, a laptop more enclosure).

  Try it
  • Open "Elements & Hierarchy" to see / extend the 6 named levels.
  • Open "Flow Compositions" to edit the parent-relative fractions.
  • Run the analysis, then use the Composition tab's sunburst: switch the
    Flow dropdown between Laptop and Smartphone and watch the rings change.
