schema_version: '1.0'
name: T05_Dynamic_TCs
description: "Tutorial T04 - Dynamic Stock Modelling\r\n\r\nModels multiple product\
  \ cohorts in a DSM Process. Construction material is used in a building.\r\n\r\n\
  What it shows\r\n• Elements material, WC (water), DM (dry matter), TC (carbon),\
  \ with the hierarchy\r\n  material = WC + DM and DM = TC + (rest).\r\n• The DSM\
  \ input is split into four product fractions.\r\n• Per fraction an individual lifetime\
  \ is modelled with a normal, a lognormal and a Weibull distribution.\r\n  \r\nTry\
  \ it\r\n• Open Flow DSM process to see the DSM Parameters.\r\n\r\nLook for\r\n•\
  \ Composition tab: the product stream is dry (no WC); the vapour stream is pure\
  \ water."
