schema_version: '1.0'
name: T05_Dynamic_TCs
description: '📘 Tutorial T05 — Dynamic transfer coefficients


  Builds on the Splitter and Transformer tutorials: transfer coefficients that change
  over time instead of staying constant.


  What it shows

  • A process whose transfer coefficients are defined per year rather than as a single
  static value.

  • The engine interpolates between the years you enter, so a split can shift gradually
  over the modelled period.

  • Dynamic TCs let you model trends — e.g. a recycling rate that rises over time.


  Try it

  • Open the Transfer Coefficients page and switch to the dynamic view to see the
  year/value points.

  • Add or move a time point (keeping each year''s outgoing split at 100%) and re-run.


  Look for

  • Sankey: step through the years and watch the split change.

  • Downstream flows track the changing coefficients over time.'
