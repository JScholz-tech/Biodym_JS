schema_version: '1.0'
name: T14_References
description: '📘 Tutorial T14 — Linking references


  Shows the reference manager: one citation reused across every parameter type that
  can carry a source reference.


  What it shows

  • A single reference (cite key) is linked to all seven parameter types that accept
  one: a transfer coefficient, a flow composition, a DSM lifetime, a FOMP decay, an
  initial stock, a scenario modification, and a Monte Carlo parameter.

  • References are managed centrally (Zotero-style cite keys) and attached per parameter
  via its "Source reference" field.


  Try it

  • Open the References page to see the citation and bump its details.

  • Open each parameter editor — each shows the same reference selected.


  Look for

  • Every parameter cites the same source: reusable, auditable provenance across the
  whole model.'
