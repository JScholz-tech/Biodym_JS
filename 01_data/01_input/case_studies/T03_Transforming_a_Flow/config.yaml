schema_version: '1.0'
name: T03_Transforming_a_Flow
description: "Tutorial T03 — Composition & element hierarchy\r\n\r\nTracks multiple\
  \ elements through a process. A \"dryer\" separates water from dry matter.\r\n\r\
  \nWhat it shows\r\n• Elements material, WC (water), DM (dry matter), TC (carbon),\
  \ with the hierarchy\r\n  material = WC + DM and DM = TC + (rest).\r\n• The input\
  \ flow's composition is set as % of its parent (30% WC, 70% DM; TC = 50% of DM).\r\
  \n• A Transformer applies a separate TC per element: water (WC) leaves as vapour,\r\
  \n  dry matter (DM, TC) leaves as product. Each element column sums to 100%.\r\n\
  \r\nTry it\r\n• Open Flow Compositions to see the parent-relative percentages.\r\
  \n• Open the Transformer's Transfer Coefficients to see the per-element split.\r\
  \n\r\nLook for\r\n• Composition tab: the product stream is dry (no WC); the vapour\
  \ stream is pure water."
