schema_version: '1.0'
name: T15_DSM_Components
description: '📘 Tutorial T04 — Dynamic Stock Modelling


  Introduces the DSM process: an inflow accumulates in a stock and leaves years later
  according to a product-lifetime distribution.


  What it shows

  • A DSM process receives an inflow that is split into several product fractions
  (categories).

  • Each fraction has its own lifetime distribution — Normal, LogNormal or Weibull
  — so cohorts leave the stock at different times.

  • The in-use stock builds up over time and releases material as each cohort reaches
  end-of-life.


  Try it

  • Open the DSM process to see its categories: inflow split (%), distribution type
  and lifetime parameters.

  • Switch a category''s distribution and re-run to see how the outflow timing changes.


  Look for

  • Stock plot: the in-use stock grows, then turns over as old cohorts retire.

  • Outflow lags the inflow by roughly the mean product lifetime.'
