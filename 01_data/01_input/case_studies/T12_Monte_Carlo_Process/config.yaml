schema_version: '1.0'
name: T12_Monte_Carlo_Process
description: '📘 Tutorial T12 — Monte Carlo on a process


  Runs a Monte Carlo simulation that varies a single process''s transfer coefficients,
  propagating that uncertainty to downstream stocks. Compare with T11, which varies
  input flows as a group.


  What it shows

  • A Splitter sends its inflow to two sinks via transfer coefficients (TCs).

  • The MC simulation samples those TCs from a Normal distribution each iteration.

  • Because all of the splitter''s outgoing TCs are varied, they are renormalised
  to sum to 1.0 — so the split shifts but total throughput is conserved.


  Try it

  • Open MC Parameters to see the two TC distributions (mean 0.3 / 0.7, std 0.05).

  • Remember TCs are fractions (0–1), not percentages — enter 0.3, not 30.

  • Increase the iteration count for a smoother distribution.


  Look for

  • The MC stock distribution for each sink: a spread around the baseline split, with
  total inflow unchanged.'
