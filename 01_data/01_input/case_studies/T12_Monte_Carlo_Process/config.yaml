schema_version: '1.0'
name: T12_Monte_Carlo_Process
description: "\U0001F4D8 Tutorial T12 — Monte Carlo on a process\r\n\r\nRuns a Monte\
  \ Carlo simulation that varies a single process's transfer coefficients, propagating\
  \ that uncertainty to downstream stocks. Compare with T11, which varies input flows\
  \ as a group.\r\n\r\nWhat it shows\r\n• A Splitter sends its inflow to two sinks\
  \ via transfer coefficients (TCs).\r\n• The MC simulation samples those TCs from\
  \ a Normal distribution each iteration.\r\n• Because all of the splitter's outgoing\
  \ TCs are varied, they are renormalised to sum to 1.0 — so the split shifts but\
  \ total throughput is conserved.\r\n\r\nTry it\r\n• Open MC Parameters to see the\
  \ two TC distributions (mean 0.3 / 0.7, std 0.05).\r\n• Remember TCs are fractions\
  \ (0–1), not percentages — enter 0.3, not 30.\r\n• Increase the iteration count\
  \ for a smoother distribution.\r\n\r\nLook for\r\n• The MC stock distribution for\
  \ each sink: a spread around the baseline split, with total inflow unchanged."
