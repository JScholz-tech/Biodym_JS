schema_version: '1.0'
name: T11_Monte_Carlo
description: '📘 Tutorial T11 — Monte Carlo on input flows (a flow group)


  Runs a Monte Carlo simulation that varies several input flows together as one correlated
  group, propagating feedstock uncertainty to the stock. Compare with T12, which varies
  a single process''s transfer coefficients.


  What it shows

  • Two feedstock flows enter the collector from the boundary.

  • Both share one MC flow group, so each iteration applies the same multiplier to
  both — they vary together (correlated), preserving their ratio.

  • A multiplier ~Normal(1.0, 0.15) scales the feedstock by about ±15%.


  Try it

  • Open MC Parameters: both flows use the group "feedstock", operation multiply.

  • A flow group needs at least two members; the shared draw is taken from the first.


  Look for

  • The MC stock distribution for the collector: a ±15% spread around the baseline,
  from correlated feedstock uncertainty.'
