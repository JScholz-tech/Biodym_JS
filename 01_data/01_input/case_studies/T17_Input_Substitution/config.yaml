schema_version: '1.0'
name: T17_Input_Substitution
description: '📘 Tutorial T17 — Demand substitution (Input_Substitution)


  An Input_Substitution process is a drop-in variant of Input: its demand target comes
  from a normal flow_data time series on its own outflow — same page, same mechanism
  as a plain Input process. Secondary/recycled supply routed back into the process
  meets part of that demand first; virgin extraction only covers what the recycled
  supply cannot.


  What it shows

  • Manufacturing needs a flat 100 Mg/yr of material — defined on the Input Flow Time
  Series page, on the Virgin Extraction process''s own outflow.

  • Recycled supply ramps from 20 up to 180 Mg/yr over the period (also flow_data,
  on the boundary Input process).

  • While supply < 100, virgin extraction covers the gap (residual). Once supply exceeds
  100, virgin extraction drops to zero and the excess becomes surplus.


  Try it

  • Open Input Flow Time Series: both the recycled-supply ramp and the 100 Mg/yr demand
  target are defined there, exactly the same way.

  • Open the Virgin Extraction process to see the supply/consumed/surplus flow wiring.

  • Change the target or the supply ramp and re-run.


  Look for

  • Virgin extraction (the residual flow, F_00_01) shrinks to zero as recycled supply
  passes the 100 Mg/yr target.

  • Recycled material consumed (F_00_01_2) and virgin residual (F_00_01) both arrive
  at Manufacturing — their sum always equals the 100 Mg/yr target.

  • Surplus recycled material (beyond the target) is diverted to storage instead of
  being wasted.'
