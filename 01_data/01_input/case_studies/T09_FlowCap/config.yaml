schema_version: '1.0'
name: T09_FlowCap
description: '📘 Tutorial T09 — Capacity-limited routing (FlowCap)


  A FlowCap process routes a flow up to a fixed capacity and sends any excess down
  an overflow path.


  What it shows

  • Waste arrives at a sorting step whose recycling capacity is capped at 100 Mg/yr.

  • The inflow ramps from 50 up to 150 Mg/yr over the period.

  • Up to the cap is sent to recycling (the capped flow); the excess overflows to
  landfill.


  Try it

  • Open the FlowCap process to see the capped flow, the overflow flow and the capacity
  series.

  • Change the cap and re-run.


  Look for

  • Recycling inflow rises, then plateaus at the 100 Mg/yr cap.

  • Landfill receives nothing until the inflow exceeds the cap, then takes only the
  overflow.'
