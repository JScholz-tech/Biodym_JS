schema_version: '1.0'
name: T10_BOM_Manufacturing
description: '📘 Tutorial T10 — BOM assembly (manufacturing)


  The BOM_Assembler builds a defined product from its inputs — a "bill of materials"
  process that fixes the element composition of its output.


  What it shows

  • A BOM_Assembler process takes an inflow and routes it to a target product (and
  optional waste flows).

  • The target product''s element composition is set by the bill of materials, not
  by the inflow.

  • Transfer coefficients must be enabled — the assembler derives its element split
  from them. (With TCs off it produces wrong results.)


  Try it

  • Open the BOM editor on the assembler to see the target-product composition.

  • Check that the process''s TC Configuration is set to Static (required).


  Look for

  • The product flow carries the bill-of-materials composition.

  • Mass balance holds across the assembler.'
