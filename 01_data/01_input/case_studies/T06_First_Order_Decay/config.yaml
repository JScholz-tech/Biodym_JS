schema_version: '1.0'
name: T06_First_Order_Decay
description: '📘 Tutorial T06 — First-order decay (FOMP)


  Introduces the FOMP process: organic matter held in a stock mineralises over time
  following first-order kinetics.


  What it shows

  • A FOMP process holds a stock that decays at a constant rate (decay constant k).

  • Material is split into a labile (fast-decaying) and a recalcitrant (slow-decaying)
  pool.

  • Decayed carbon leaves through a defined outflow; the remainder stays in the stock.


  Try it

  • Open the FOMP process to see the labile fraction and the decay rates.

  • Change a decay rate and re-run to see how fast the stock depletes.


  Look for

  • Stock plot: an exponential-style decline as the pools mineralise.

  • The larger the rate k, the quicker the stock falls.'
