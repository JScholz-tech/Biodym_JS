# NOTE: Keep this in sync with the runtime dependencies in pyproject.toml.
# The pyproject.toml (used by `uv sync`) is the source of truth; this file
# mirrors it for conda users. If you add a dependency there, add it here too.
name: biodym_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  - python-graphviz>=0.21
  - ipywidgets>=8.1.7
  - jupyter>=1.1.1
  - ipykernel
  - widgetsnbextension
  - jupyterlab_widgets
  - anywidget>=0.9.18
  - marimo>=0.23.3
  - matplotlib>=3.10.6
  - notebook>=7.4.5
  - numpy>=2.3.3
  - openpyxl>=3.1.5
  - pandas>=2.3.2
  - plotly>=6.3.0
  - pytest>=8.4.2
  - pytest-mock>=3.15.0
  - scipy>=1.16.1
  - seaborn>=0.13.2
  - tqdm>=4.67.1
  - xlrd>=2.0.2
  - xlsxwriter>=3.2.5
  - xlwt>=1.3.0
  # bioDYM SystemDefiner web app + YAML workflow (required for `python -m systemdefiner`)
  - fastapi>=0.110.0
  - uvicorn-standard>=0.27.0
  - jinja2>=3.1.0
  - python-multipart>=0.0.6
  - pydantic>=2.0.0
  - httpx>=0.27.0
  - pyyaml>=6.0.2
  - jupytext>=1.16.0
  - voila>=0.5.11
  - pip
  - pip:
    - kaleido
